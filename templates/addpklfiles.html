{% extends "base.html" %}

{% block body %}

<div class="container mt-5">
    <h2 class="text-center" style="color:white;">Add New Pose</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="pose_name" class="form-label" style="color:white;">Pose Name</label>
            <input type="text" class="form-control" id="pose_name" name="pose_name" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label" style="color:white;">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="pose_file" class="form-label" style="color:white;">Upload File</label>
            <input type="file" class="form-control" id="pose_file" name="pose_file" required>
        </div>
        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>

{% endblock body %}
