{% extends "base.html" %}

{% block body %}

<style>
    /* General Styles */
    .custom-card {
        border-radius: 12px;
        overflow: hidden;
        transition: box-shadow 0.3s ease;
    }

    .custom-card:hover {
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .custom-header {
        background-color: rgb(160, 23, 57); /* Adjust color if necessary */
        font-size: 24px;
        letter-spacing: 1px;
        color: white;
        font-size: 30px;
        text-align: center;
        padding: 15px;
    }

    .custom-card-body {
        padding: 20px;
    }

    /* Form Fields */
    .form-floating input,
    .form-floating textarea {
        border-radius: 5px;
        border: 1px solid #ccc;
        padding: 12px 15px;
        width: 100%;
    }

    .form-floating label {
        color: #666;
        font-weight: 500;
    }

    /* Button */
    .btn-xl {
        padding: 10px 40px;
        font-size: 18px;
        background-color: rgb(160, 23, 57);
        border: none;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }

    .btn-xl:hover {
        background-color: rgb(230, 107, 85);
    }
    

    /* Responsive Layout */
    @media (max-width: 768px) {
        .custom-card {
            margin-bottom: 20px;
        }

        .form-floating input {
            font-size: 14px;
            padding: 10px 12px;
        }

        .btn-xl {
            padding: 8px 30px;
            font-size: 16px;
        }
    }

    /* Adjust Heading */
    .page-section-heading {
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 40px;
    }

    /* Submit Button Center */
    .text-center {
        text-align: center;
    }

    /* Container Padding */
    .container-padding {
        padding: 10px;
    }
</style>

<section class="page-section" id="contact">
    <div class="container">
        <h2 class="page-section-heading text-center text-uppercase mb-4 mt-5" style="color: white;">Registration</h2>

        <div class="container mt-4 container-padding">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-md-10 col-sm-12">
                    <div class="card shadow-lg border-0 custom-card">
                        <div class="card-header custom-header">
                            Register
                        </div>
                        <div class="card-body p-4 custom-card-body">
                            <form action="register" method="POST">
                                {% csrf_token %}
                                
                                <!-- First Row -->
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="fname" name="fname" type="text" placeholder="First Name" required />
                                            <label for="fname">First Name</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="lname" name="lname" type="text" placeholder="Last Name" required />
                                            <label for="lname">Last Name</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="phone" name="phone" type="text" placeholder="Phone Number" minlength="10" maxlength="10" required oninput="validatePhoneNumber(this);" />
                                            <label for="phone">Phone Number</label>
                                            <small id="phone_error_message" style="color: red; display: none;">Please enter a valid 10-digit contact number</small>
                                        </div>
                                    </div>
                                </div>

                                <!-- Second Row -->
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="age" name="age" type="number" placeholder="Age" required />
                                            <label for="age">Age</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="height" name="height" type="text" placeholder="Height (cm)" required />
                                            <label for="height">Height (cm)</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="weight" name="weight" type="text" placeholder="Weight (kg)" required />
                                            <label for="weight">Weight (kg)</label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Third Row -->
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="username" type="email" name="username" placeholder="Email Address" required />
                                            <label for="username">Email Address</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="password" name="password" type="password" placeholder="Password" required />
                                            <label for="password">Password</label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" required />
                                            <label for="confirmPassword">Confirm Password</label>
                                        </div>
                                    </div>
                                </div>
                                <!-- Submit Button -->
                                <div class="text-center mt-3">
                                    <button class="btn btn-primary btn-xl" id="submitButton" type="submit">Submit</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    function validatePhoneNumber(input) {
        const phoneError = document.getElementById('phone_error_message');
        input.value = input.value.replace(/\D/g, ''); // Removes non-digit characters
        
        if (input.value.length !== 10) {
            phoneError.style.display = 'block';
        } else {
            phoneError.style.display = 'none';
        }
    }
</script>


{% endblock body %}
